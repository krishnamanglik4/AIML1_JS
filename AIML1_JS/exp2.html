<!DOCTYPE html>
<html>
<head>
<title>Employee Management System</title>

<style>
body{
    font-family: Arial;
    background: #f4f6f8;
    text-align:center;
}

.container{
    width: 70%;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    padding:8px;
    margin:5px;
    width:180px;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse: collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

.result{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Employee Management System</h2>

<input type="text" id="name" placeholder="Employee Name">
<input type="text" id="id" placeholder="Employee ID">
<input type="number" id="salary" placeholder="Salary">
<input type="text" id="dept" placeholder="Department">

<br>

<button onclick="addEmployee()">Add Employee</button>
<button onclick="displayEmployees()">Display All</button>
<button onclick="filterSalary()">Salary > 50000</button>
<button onclick="totalSalary()">Total Salary</button>
<button onclick="averageSalary()">Average Salary</button>
<button onclick="countDepartment()">Count Department</button>

<div class="result" id="result"></div>

<table id="table">
<tr>
<th>Name</th>
<th>ID</th>
<th>Salary</th>
<th>Department</th>
</tr>
</table>

</div>

<script>

let employees = [];

function addEmployee(){

let name = document.getElementById("name").value;
let id = document.getElementById("id").value;
let salary = Number(document.getElementById("salary").value);
let dept = document.getElementById("dept").value;

let emp = {
name:name,
id:id,
salary:salary,
dept:dept
};

employees.push(emp);

alert("Employee Added Successfully");
}

function displayEmployees(){

let table = document.getElementById("table");

table.innerHTML = `
<tr>
<th>Name</th>
<th>ID</th>
<th>Salary</th>
<th>Department</th>
</tr>
`;

for(let e of employees){

table.innerHTML += `
<tr>
<td>${e.name}</td>
<td>${e.id}</td>
<td>${e.salary}</td>
<td>${e.dept}</td>
</tr>
`;
}

}

function filterSalary(){

let high = employees.filter(e => e.salary > 50000);

let text = "Employees with salary > 50000:<br>";

for(let e of high){
text += e.name + " - ₹" + e.salary + "<br>";
}

document.getElementById("result").innerHTML = text;

}

function totalSalary(){

let total = 0;

for(let e of employees){
total += e.salary;
}

document.getElementById("result").innerHTML =
"Total Salary Payout = ₹" + total;

}

function averageSalary(){

let total = 0;

for(let e of employees){
total += e.salary;
}

let avg = total / employees.length;

document.getElementById("result").innerHTML =
"Average Salary = ₹" + avg;

}

function countDepartment(){

let d = prompt("Enter Department Name");

let count = 0;

for(let e of employees){

if(e.dept.toLowerCase() == d.toLowerCase()){
count++;
}

}

document.getElementById("result").innerHTML =
"Employees in " + d + " Department = " + count;

}

</script>

</body>
</html>
